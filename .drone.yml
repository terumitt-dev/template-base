# base-drone.yml
kind: pipeline
type: docker
name: base

#──────────────────────────────
# 共通環境変数
#──────────────────────────────
environment:
  AWS_REGION:
    from_secret: AWS_REGION        # Secret で可変
  ECR_REPO: ""                     # 各リポジトリで必ず設定
  AWS_ACCESS_KEY_ID:
    from_secret: aws_access_key_id
  AWS_SECRET_ACCESS_KEY:
    from_secret: aws_secret_access_key

#──────────────────────────────
# 共通ステップ
#──────────────────────────────
steps:
  # 変数チェック
  - name: check-vars
    image: alpine
    commands:
      - '[ -n "$ECR_REPO" ] || (echo "ECR_REPO is not set" && exit 1)'
      - '[ -n "$AWS_REGION" ] || (echo "AWS_REGION is not set" && exit 1)'

  # 確認用ステップ（安全な範囲のみ echo）
  - name: info
    image: alpine
    commands:
      - echo "Running common Drone steps"
      - echo "AWS_REGION=${AWS_REGION}"
      - echo "ECR_REPO=${ECR_REPO}"

