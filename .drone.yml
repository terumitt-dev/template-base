kind: pipeline
type: docker
name: base

environment:
  AWS_REGION:
    from_secret: AWS_REGION
  ECR_REPO:                # 各リポジトリで必ず設定
  AWS_ACCESS_KEY_ID:
    from_secret: aws_access_key_id
  AWS_SECRET_ACCESS_KEY:
    from_secret: aws_secret_access_key

steps:
  # 必須変数チェック
  - name: check-vars
    image: alpine
    commands:
      - '[ -n "$ECR_REPO" ] || (echo "ECR_REPO is not set" && exit 1)'
      - '[ -n "$AWS_REGION" ] || (echo "AWS_REGION is not set" && exit 1)'
      - '[ -n "$AWS_ACCESS_KEY_ID" ] || (echo "AWS_ACCESS_KEY_ID is not set" && exit 1)'
      - '[ -n "$AWS_SECRET_ACCESS_KEY" ] || (echo "AWS_SECRET_ACCESS_KEY is not set" && exit 1)'

  # 確認用ステップ（必要なければ削除可能）
  - name: info
    image: alpine
    commands:
      - echo "Running common Drone steps"
      - echo "ECR_REPO=${ECR_REPO}"

