name: Trigger AI Review

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write
  actions: read

jobs:
  # ──────────────────────────────────────
  # Team member check (shared by all jobs)
  # ──────────────────────────────────────
  check-team-member:
    if: |
      (github.event_name == 'issue_comment' && (
        github.event.comment.body == '/review' ||
        github.event.comment.body == '/describe' ||
        github.event.comment.body == '/improve' ||
        contains(github.event.comment.body, '@claude')
      )) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    outputs:
      allowed: ${{ steps.check.outputs.allowed }}
      run_qodo: ${{ steps.detect.outputs.run_qodo }}
      run_claude: ${{ steps.detect.outputs.run_claude }}
    steps:
      - name: Detect command type
        id: detect
        run: |
          BODY="${{ github.event.comment.body || github.event.review.body || github.event.issue.body }}"
          if [ "$BODY" = "/improve" ]; then
            echo "run_qodo=true" >> "$GITHUB_OUTPUT"
            echo "run_claude=true" >> "$GITHUB_OUTPUT"
          elif echo "$BODY" | grep -q '@claude'; then
            echo "run_qodo=false" >> "$GITHUB_OUTPUT"
            echo "run_claude=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_qodo=true" >> "$GITHUB_OUTPUT"
            echo "run_claude=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Check if commenter is in team
        id: check
        run: |
          EVENT_NAME="${{ github.event_name }}"
          if [ "$EVENT_NAME" = "issues" ]; then
            COMMENTER=${{ github.event.issue.user.login }}
          elif [ "$EVENT_NAME" = "pull_request_review" ]; then
            COMMENTER=${{ github.event.review.user.login }}
          else
            COMMENTER=${{ github.event.comment.user.login }}
          fi

          TEAM_MEMBERS=$(curl -s -H "Authorization: Bearer ${{ secrets.TEAM_PAT }}" \
            https://api.github.com/orgs/terumitt-dev/teams/ai-reviewers/members)

          LOGINS=$(echo "$TEAM_MEMBERS" | jq -r '.[].login')

          if echo "$LOGINS" | grep -q "^$COMMENTER$"; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
          else
            echo "allowed=false" >> "$GITHUB_OUTPUT"
          fi

  # ──────────────────────────────────────
  # PR Pilot (OpenAI) - /review /describe /improve
  # ──────────────────────────────────────
  ai-review:
    needs: check-team-member
    if: |
      needs.check-team-member.outputs.allowed == 'true' &&
      needs.check-team-member.outputs.run_qodo == 'true'
    uses: terumitt-dev/github_actions_ci-cd/.github/workflows/reusable-ci.yml@main
    with:
      pr_number: ${{ github.event.issue.number }}
      command: ${{ github.event.comment.body }}
      target_repo: ${{ github.repository }}
    secrets:
      OPENAI_KEY: ${{ secrets.OPENAI_KEY }}

  # ──────────────────────────────────────
  # Claude Code - @claude mentions
  # ──────────────────────────────────────
  claude-code:
    needs: check-team-member
    if: |
      needs.check-team-member.outputs.allowed == 'true' &&
      needs.check-team-member.outputs.run_claude == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          direct_prompt: |
            ${{ needs.check-team-member.outputs.run_qodo == 'true' && 'このPRの差分をレビューし、コードの改善提案をしてください。' || '' }}
          additional_permissions: |
            actions: read
